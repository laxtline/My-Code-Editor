name: Publish Windows installer package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to package
        required: true
        default: v1.2.0

permissions:
  contents: read
  packages: write

concurrency:
  group: windows-package-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Download the published Windows assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern 'Local-Code-Compiler-Setup.exe' \
            --pattern 'Local-Code-Compiler.exe' \
            --pattern 'Local-Code-Compiler-Windows-x64.zip' \
            --pattern 'SHA256SUMS.txt'
      - name: Verify release checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish EXEs and bundle to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          mvn --batch-mode org.apache.maven.plugins:maven-deploy-plugin:3.2.0:deploy-file
          -DpomFile=packages/pom.xml
          -Dfile=release/Local-Code-Compiler-Setup.exe
          -Dfiles=release/Local-Code-Compiler.exe,release/Local-Code-Compiler-Windows-x64.zip
          -Dclassifiers=portable,bundle
          -Dtypes=exe,zip
          -DrepositoryId=github
          -Durl=https://maven.pkg.github.com/${{ github.repository }}
          -DretryFailedDeploymentCount=2
